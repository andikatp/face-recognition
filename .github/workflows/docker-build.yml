name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Target the final runtime stage only (builder is discarded)
          target: runtime
          tags: |
            andikatp/liveness-api:latest
            andikatp/liveness-api:${{ github.sha }}
          # Layer cache: reuse builder dependencies across runs (saves minutes)
          cache-from: type=registry,ref=andikatp/liveness-api:buildcache
          cache-to: type=registry,ref=andikatp/liveness-api:buildcache,mode=max
