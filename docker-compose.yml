services:
  face-recognition-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-recognition-api:latest
    container_name: face-recognition-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=2
      - DETECTOR_BACKEND=yunet
      - MAX_DIMENSION=640
      - MIN_FACE_CONFIDENCE=0.35
      - APP_VERSION=1.0.1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: face-recognition-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
